baseURL = "https://xn--dtour-bsa.studio/"
title = "détour studio"
timeZone = "Europe/Paris"
defaultContentLanguage = "fr"
locale = "fr-FR"
printI18nWarnings = true


theme = "detour"
sectionPagesMenu = "works"
buildFuture = true
enableEmoji = false
rssLimit = 10
cleanDestinationDir = true
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[module]
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "content/weeknotes/images"
target = "assets/weeknotes/images"

[params]
description = "Construire des services numériques d'intérêt général, accessibles, sobres et ouverts. Pas à pas, ensemble."
pronouns = "il / lui"

[params.author]
name = "Thomas Parisot"
email = "contact@detour.studio"

[params.social]
twitter = "thom4parisot"
github = "https://github.com/thom4parisot"
mastodon = "https://diaspodon.fr/@thom4"
fediverse = "@thom4@diaspodon.fr"
website = "https://thom4.net"

[params.contact]
modes = [
  "synchrone, par **téléphone** ou **visio** — pour un échange rapide, pour se donner rendez-vous",
  "asynchrone, par **email** — pour présenter un projet, donner du contexte et joindre des documents",
  "asynchrone par [**SMS**](sms:+33608403549) ou [**Signal**](https://signal.me/#eu/n6TkQ-1rnWYwYveviRgI2WQkOD6F3Pw1-vOOuDDngvhfHKNWYDBMUpJQAKZgc7Kv) — pour une prise de contact rapide ou un vocal",
]

[[params.contact.channels]]
label = "Téléphone"
hrefLabel = "06 08 40 35 49"
href = "tel:+33608403549"
[[params.contact.channels]]
label = "Signal"
hrefLabel = "Envoyer un message"
href = "https://signal.me/#eu/n6TkQ-1rnWYwYveviRgI2WQkOD6F3Pw1-vOOuDDngvhfHKNWYDBMUpJQAKZgc7Kv"

[params.organisation]
name = "Solstice SCOP CAE"
url = "https://solstice.coop"
siret = "43827938200040"
tva = "FR54438279382"
qualiopi = true

[params.workStatus]
done = "Fini"
ongoing = "En cours"
cancelled = "Annulé"
paused = "En pause"
upcoming = "À venir"

# Palette des images de partage (og-image.html) : Hugo ne lit pas les variables CSS,
# ces valeurs recopient les tokens de critical.css (section-pale, section-base, section-fonce).
[params.palette]
ink = "#4f5200"
[params.palette.default]
pale = "#f4dc9a"
base = "#d6ab55"
fonce = "#6b6147"
[params.palette.works]
pale = "#f7dcc9"
base = "#e6a57c"
fonce = "#9a4826"
[params.palette.categories]
pale = "#f7dcc9"
base = "#e6a57c"
fonce = "#9a4826"
[params.palette.weeknotes]
pale = "#e6dcf5"
base = "#a597d3"
fonce = "#65539c"
[params.palette.yearnotes]
pale = "#e6dcf5"
base = "#a597d3"
fonce = "#65539c"

[related]
includeNewer = true
toLower = true
[[related.indices]]
name = "keywords"
weight = 100
[[related.indices]]
name = "for"
weight = 50

[permalinks]
# works = "/works/:filename"

[outputFormats]
[outputFormats.opml]
basename = "collection"
mediaType = "application/xml"

[markup]
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[markup.goldmark]
[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false
[markup.goldmark.parser.attribute]
block = true
[markup.goldmark.renderer]
unsafe = true
attribute = true

[menu]

[taxonomies]
category = "categories"
stack = "stack"
