baseURL = "https://xn--dtour-bsa.studio/"
title = "détour studio"
timeZone = "Europe/Paris"
defaultContentLanguage = "fr"
locale = "fr-FR"
printI18nWarnings = true


theme = "detour"
sectionPagesMenu = "works"
buildFuture = true
enableEmoji = true
rssLimit = 10
cleanDestinationDir = true
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[module]
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "content/weeknotes/images"
target = "assets/weeknotes/images"

[params]
description = "Je construis des projets numériques d'intérêt général avec des technologies web : services accessibles, open data et innovation d'usage, pas à pas."
pronouns = "il / lui"

[params.author]
name = "Thomas Parisot"
email = "contact@detour.studio"

[params.social]
twitter = "thom4parisot"
github = "https://github.com/thom4parisot"
mastodon = "https://diaspodon.fr/@thom4"
fediverse = "@thom4@diaspodon.fr"
website = "https://thom4.net"

[params.contact]
modes = [
  "synchrone, par **téléphone** ou **visio** — pour un échange rapide, pour se donner rendez-vous",
  "asynchrone, par **email** — pour présenter un projet, donner du contexte et joindre des documents",
  "asynchrone par [**SMS**](sms:+33608403549) ou [**Signal**](https://signal.me/#eu/n6TkQ-1rnWYwYveviRgI2WQkOD6F3Pw1-vOOuDDngvhfHKNWYDBMUpJQAKZgc7Kv) — pour une prise de contact rapide ou un vocal",
]

[[params.contact.channels]]
label = "Téléphone"
hrefLabel = "06 08 40 35 49"
href = "tel:+33608403549"
[[params.contact.channels]]
label = "Signal"
hrefLabel = "Envoyer un message"
href = "https://signal.me/#eu/n6TkQ-1rnWYwYveviRgI2WQkOD6F3Pw1-vOOuDDngvhfHKNWYDBMUpJQAKZgc7Kv"

[params.organisation]
name = "Solstice SCOP CAE"
url = "https://solstice.coop"
siret = "43827938200040"
tva = "FR54438279382"
qualiopi = true

[params.workStatus]
done = "Fini"
ongoing = "En cours"
cancelled = "Annulé"
paused = "En pause"
upcoming = "À venir"

[related]
includeNewer = true
toLower = true
[[related.indices]]
name = "keywords"
weight = 100
[[related.indices]]
name = "for"
weight = 50

[permalinks]
# works = "/works/:filename"

[outputFormats]
[outputFormats.opml]
basename = "collection"
mediaType = "application/xml"

[markup]
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[markup.goldmark]
[markup.goldmark.parser.attribute]
block = true
[markup.goldmark.renderer]
unsafe = true
attribute = true

[menu]

[taxonomies]
category = "categories"
stack = "stack"
