baseURL = "https://xn--dtour-bsa.studio/"
title = "détour studio"
timeZone = "Europe/Paris"
defaultContentLanguage = "fr"
locale = "fr-FR"
printI18nWarnings = true

theme = "detour"
sectionPagesMenu = "works"
buildFuture = true
enableEmoji = true
rssLimit = 10
cleanDestinationDir = true
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[params]
description = "Développement web en mode agile, publications multiformats, accessibilité numérique et accompagnement d'équipes multi-disciplinaires."
pronouns = "il / lui"

[params.author]
name = "Thomas Parisot"
email = "contact@detour.studio"

[params.social]
twitter = "thom4parisot"
github = "https://github.com/thom4parisot"
mastodon = "https://diaspodon.fr/@thom4"
fediverse = "@thom4@diaspodon.fr"
website = "https://thom4.net"

[params.workStatus]
done = "Fini"
ongoing = "En cours"
cancelled = "Annulé"
paused = "En pause"
upcoming = "À venir"

[related]
includeNewer = true
toLower = true
[[related.indices]]
name = "keywords"
weight = 100
[[related.indices]]
name = "for"
weight = 50

[permalinks]
# works = "/works/:filename"

[outputFormats]
[outputFormats.opml]
basename = "collection"
mediaType = "application/xml"

[markup]
[markup.tableOfContents]
startLevel = 3

[markup.goldmark]
[markup.goldmark.parser.attribute]
block = true
[markup.goldmark.renderer]
unsafe = true
attribute = true

[menu]

[taxonomies]
category = "categories"
stack = "stack"
