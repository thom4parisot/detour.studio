{{- $img := or (.Page.Resources.Get .Destination) (resources.Get .Destination) -}}
<span role="figure" class="markdown-image"{{ with .Title }} aria-labelledby="image-{{ $.Destination | anchorize }}-caption"{{ end }}>
  {{ with $img }}
  <img src="{{ ((. | images.Filter images.AutoOrient).Fit "1440x1440 webp").RelPermalink }}" alt="{{ $.PlainText }}" loading="lazy">
  {{ else }}
  <img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}" loading="lazy">
  {{ end }}
  {{ with .Title }}
  <span class="figcaption" id="image-{{ $.Destination | anchorize }}-caption">{{ . | markdownify }}.</span>
  {{ end }}
</span>
